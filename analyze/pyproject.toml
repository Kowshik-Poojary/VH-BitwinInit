[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Production-oriented Python resource leak static analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LeakGuard Team"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
leakguard = "leakguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["leakguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
