[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Python static resource-leak detection for CI/CD"
requires-python = ">=3.10"
dependencies = [
	"PyYAML>=6.0",
]

[project.scripts]
leakguard = "leakguard.cli:main"

[tool.setuptools.packages.find]
include = ["leakguard*"]
