name: LeakGuard

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  leakguard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LeakGuard
        run: python -m pip install .

      - name: Run LeakGuard tests
        run: python -m unittest discover -s tests -v

      - name: Scan repository and generate SARIF
        id: leakguard_scan
        shell: bash
        run: |
          set +e
          leakguard scan . --exclude examples --exclude benchmarks --format sarif > leakguard.sarif
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: leakguard.sarif

      - name: Fail when LeakGuard finds blocking leaks
        if: steps.leakguard_scan.outputs.exit_code != '0'
        run: exit 1
