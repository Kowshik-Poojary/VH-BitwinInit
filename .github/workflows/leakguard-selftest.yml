name: LeakGuard Self-Test

on:
  push:
    branches: [ main, Kowshik ]
  pull_request:
    branches: [ main, Kowshik ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest
        run: |
          pytest -v

  action-check:
    name: LeakGuard Action CI Run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run LeakGuard on Project
        uses: ./
        with:
          path: "src"
          format: "sarif"
          output: "leakguard.sarif"
          fail-on: "error"

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "leakguard.sarif"
