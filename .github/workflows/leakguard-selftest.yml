name: LeakGuard Self-Test

on:
  push:
    branches: [main, Kowshik]
  pull_request:
    branches: [main, Kowshik]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest
        run: |
          pytest -v

  action-check:
    name: LeakGuard Action CI Run
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run LeakGuard on Project
        uses: ./
        env:
          LEAKGUARD_USER_ID: ${{ github.actor }}
        with:
          path: "src"
          format: "sarif"
          output: "leakguard.sarif"
          fail-on: "error"
          report-url: ${{ vars.LEAKGUARD_REPORT_URL }}

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "leakguard.sarif"
