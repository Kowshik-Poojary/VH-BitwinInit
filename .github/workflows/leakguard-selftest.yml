name: LeakGuard CI Gatekeeper (AST Resource Leak Verification)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest
        run: |
          pytest -v

  ast-leak-gatekeeper:
    name: AST Resource-Leak Gatekeeper (Warn -> Block)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LeakGuard
        run: |
          pip install -e .

      - name: Real-Time AST Verification & Warn Phase
        id: leakguard_scan
        continue-on-error: true
        env:
          LEAKGUARD_USER_ID: ${{ github.actor }}
        run: |
          echo "::group::🔍 Running LeakGuard Deterministic AST & CFG Analysis..."
          leakguard scan src \
            --format sarif \
            --output leakguard.sarif \
            --fail-on error \
            --min-confidence low \
            --report-url "${{ vars.LEAKGUARD_REPORT_URL }}"
          echo "SCAN_EXIT_CODE=$?" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "leakguard.sarif"

      - name: Gatekeeper Policy Evaluation (Hard Block on Unresolved Leaks)
        if: always()
        run: |
          if [ "${{ steps.leakguard_scan.outcome }}" != "success" ]; then
            echo "::error title=LeakGuard Gatekeeper Blocked::🛑 Critical unclosed resource leaks detected in branch '${{ github.ref_name }}'! Merge blocked until all unclosed handles are remediated."
            exit 1
          else
            echo "::notice title=LeakGuard Gatekeeper Passed::✅ All execution paths verified: 0 resource leaks found. Merge approved!"
          fi
